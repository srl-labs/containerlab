# this workflow is a workaround for docs-test job of ci-cd workflow failures
# as github rate limits the number of HTTP requests
# use only when you need to build the binaries/artifacts first making sure that other tests pass
name: force-build
on:
  workflow_dispatch:

env:
  CGO_ENABLED: 0
  GORELEASER_VER: v2.0.1

jobs:
  get-tag:
    runs-on: ubuntu-24.04
    outputs:
      git_tag: ${{ steps.git_tag.outputs.git_tag }}
      go_ver: ${{ steps.git_tag.outputs.go_ver }}
      uv_ver: ${{ steps.git_tag.outputs.uv_ver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get git tag
        id: git_tag
        run: |
          source .github/vars.env
          echo "go_ver=$GO_VER" >> "$GITHUB_OUTPUT"
          echo "uv_ver=$UV_VER" >> "$GITHUB_OUTPUT"
          git_tag=$(git tag --points-at | tr '\n' ' ')
          echo "git_tag=$git_tag" >> "$GITHUB_OUTPUT"
          echo "$git_tag"

  build-and-release:
    needs:
      - get-tag
    if: ${{ needs.get-tag.outputs.git_tag != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ needs.get-tag.outputs.go_ver }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FURY_TOKEN: ${{ secrets.FURYPUSHTOKEN }}

  publish-docs:
    needs:
      - build-and-release
      - get-tag
    runs-on: ubuntu-24.04
    if: contains(github.ref, '-') != true # do not publish docs for beta releases which will have something like v0.0.0-0.33.0-beta
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.get-tag.outputs.uv_ver }}
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Build docs with Zensical
        if: ${{ contains(needs.get-tag.outputs.git_tag, '-') != true }}
        run: |
          uv run --group docs zensical build --clean --strict
          test -f site/index.html

      - name: Deploy to GitHub Pages
        if: ${{ contains(needs.get-tag.outputs.git_tag, '-') != true }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # CNAME ships via docs/CNAME -> site/CNAME, preserving the custom domain.
