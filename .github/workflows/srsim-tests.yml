name: srsim-tests

"on":
  workflow_call:
    inputs:
      py_ver:
        required: true
        type: string
      uv_ver:
        required: true
        type: string
      runtime:
        type: string
        default: "docker"
      ref:
        type: string
        default: ""
    secrets:
      SRSIM_LICENSE:
        required: false

jobs:
  check-license:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
        run: |
          if [[ -n "$SRSIM_LICENSE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  srsim-tests:
    runs-on: ubuntu-24.04
    needs: check-license
    if: needs.check-license.outputs.available == 'true'
    env:
      SRSIM_IMAGE_TAG: 26.7.R1
    strategy:
      matrix:
        include:
          - shard: basic
            test_suites: "01-sros-to-linux.robot 07-srsim-with-mgmt-network.robot 12-srsim-veth-stitch.robot"
          - shard: lifecycle
            test_suites: "04-sros-classic.robot 06-srsim-sar.robot 10-srsim-lifecycle.robot"
          - shard: components
            test_suites: "05-sros-comp-to-linux.robot 09-srsim-pause-container.robot 14-srsim-new-chassis.robot 15-srsim-prompt-password.robot"
          - shard: provisioning
            test_suites: "03-sros-dist-to-linux.robot 08-srsim-comp-cfg-test.robot 13-srsim-integrated.robot"
          - shard: apply
            test_suites: "11-srsim-apply.robot"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: containerlab-tests

      - name: Move containerlab to usr/bin
        run: sudo mv ./containerlab /usr/bin/containerlab && sudo chown root:root /usr/bin/containerlab && sudo chmod 4755 /usr/bin/containerlab

      - name: Create license file from env vars
        env:
          SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
        run: sudo mkdir -p /opt/nokia/sros/ && echo "$SRSIM_LICENSE" | sudo tee /opt/nokia/sros/license.txt > /dev/null && sudo chmod 600 /opt/nokia/sros/license.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: ${{ inputs.uv_ver }}
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          # cache: pip
          # cache-dependency-path: "tests/requirements.txt"
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Activate virtualenv
        run: |
          . .venv/bin/activate
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Set shard name
        run: echo "TEST_SUITE=${{ matrix.shard }}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and re-tag srsim image
        run: |
          image="ghcr.io/srl-labs/containerlab/nokia_srsim:${SRSIM_IMAGE_TAG}"
          docker pull "$image"
          docker tag "$image" "registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}"

      - name: Logout from GitHub Container Registry
        run: docker logout ghcr.io

      # - name: setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Run sros-srsim tests
        run: |
          for test_suite in ${{ matrix.test_suites }}; do
            ./tests/rf-run.sh ${{ inputs.runtime }} "./tests/13-srsim/${test_suite}"
          done
      # upload test reports as a zip file
      - name: Upload test logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 13-srsim-log-${{ env.TEST_SUITE }}-${{ inputs.runtime }}
          path: ./tests/out/*.html

      # upload coverage report from unit tests, as they are then
      # merged with e2e tests coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-srsim-tests-${{ env.TEST_SUITE }}-${{ inputs.runtime }}
          path: /tmp/clab-tests/coverage/*
          retention-days: 7
