# yaml-language-server: $schema=../../schemas/clab.schema.json
name: sr13

mgmt:
  - network: sr13-main
    ipv4-subnet: 10.78.150.0/24
    ipv6-subnet: fd00:10:78:150::/64
  - network: sr13-int
    ipv4-subnet: 10.78.151.0/24
    ipv6-subnet: fd00:10:78:151::/64
  - network: sr13-dist
    ipv4-subnet: 10.78.152.0/24
    ipv6-subnet: fd00:10:78:152::/64

topology:
  kinds:
    nokia_srsim:
      license: /opt/nokia/sros/license.txt
      image: registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}
  nodes:
    l1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      mgmt-net: sr13-main
      exec:
        - >
          ash -c '
          ip l set dev eth1 up &&
          ip addr add dev eth1 10.0.0.1/24'
    sr-int:
      kind: nokia_srsim
      type: sr-1
      mgmt-net: {{ .srIntNetwork }}
{{- if eq .srIntNetwork "sr13-int" }}
      mgmt-ipv4: 10.78.151.10
      mgmt-ipv6: fd00:10:78:151::10
{{- end }}
      startup-config: |
        /configure card 1 card-type iom-1
        /configure card 1 mda 1 mda-type me6-100gb-qsfp28
        /configure card 1 mda 2 mda-type me12-100gb-qsfp28
        /configure port 1/1/c1 connector breakout c1-100g
        /configure port 1/1/c1 admin-state enable
        /configure port 1/1/c1/1 ethernet mode hybrid
        /configure port 1/1/c1/1 admin-state enable
        /configure router "Base" interface "to-linux" port 1/1/c1/1:0
        /configure router "Base" interface "to-linux" ipv4 primary address 10.0.0.2
        /configure router "Base" interface "to-linux" ipv4 primary prefix-length 24
    sr-dist:
      kind: nokia_srsim
      type: sr-1-92s
      mgmt-net: sr13-dist
      components:
        - slot: A
        - slot: 1
  links:
    - endpoints: ["l1:eth1", "sr-int:1/1/c1/1"]
