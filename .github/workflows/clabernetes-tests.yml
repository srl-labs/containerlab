name: clabernetes-tests

"on":
  workflow_call:
    inputs:
      py_ver:
        required: true
        type: string
      go_ver:
        required: true
        type: string

jobs:
  clabernetes-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the suite runs the Go library tests of node access (go test ./core/)
      # against the cluster
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_ver }}

      - uses: actions/download-artifact@v7
        with:
          name: containerlab

      - name: Move containerlab to usr/bin
        run: sudo mv ./containerlab /usr/bin/containerlab && sudo chown root:root /usr/bin/containerlab && sudo chmod 4755 /usr/bin/containerlab

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.28"
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Install kubectl
        run: |
          curl -L -o ./kubectl "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create kind cluster
        run: |
          cat > /tmp/c9s-kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
          containerdConfigPatches:
          - |-
            [plugins."io.containerd.grpc.v1.cri".containerd]
              discard_unpacked_layers = false
          EOF

          kind create cluster --name c9s --config /tmp/c9s-kind-config.yaml
          kubectl wait --for=condition=Ready nodes --all --timeout=120s

      # node stats come from the resource metrics API (metrics.k8s.io), which
      # kind does not serve on its own. kind kubelets use self-signed serving
      # certificates, hence --kubelet-insecure-tls.
      - name: Install metrics-server
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deploy/metrics-server --timeout=180s
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=180s

      - name: Install Clabernetes
        run: |
          # create the mounted directories as the runner user, otherwise docker
          # creates them (and ~/.cache, which holds the Go build cache) as root
          mkdir -p "${HOME}/.kube" "${HOME}/.helm" "${HOME}/.config/helm" "${HOME}/.cache/helm"
          docker run --network host --rm \
            -v "${HOME}/.kube:/root/.kube" \
            -v "${HOME}/.helm:/root/.helm" \
            -v "${HOME}/.config/helm:/root/.config/helm" \
            -v "${HOME}/.cache/helm:/root/.cache/helm" \
            alpine/helm:3.18.2 \
            upgrade --install --create-namespace --namespace c9s \
              clabernetes oci://ghcr.io/clabernetes/clabernetes/clabernetes:0.0.0

          kubectl -n c9s rollout status deploy/clabernetes-manager --timeout=180s

      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tshark

      - name: Run Clabernetes Robot tests
        run: |
          bash ./tests/rf-run.sh c9s ./tests/14-clabernetes

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 14-clabernetes-log
          path: ./tests/out/*.html

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-clabernetes-tests
          path: /tmp/clab-tests/coverage/*
          retention-days: 7
