# yaml-language-server: $schema=../../schemas/clab.schema.json
name: comp-cfg-gen-test

topology:
  kinds:
    nokia_srsim:
      license: /opt/nokia/sros/license.txt
      image: registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}

  nodes:
    sr1:
      kind: nokia_srsim
      type: sr-1

    sr2s:
      kind: nokia_srsim
      type: sr-2s
      sfm: sfm-2s
      components:
        - slot: A
          type: cpm-2s
        - slot: 1
          type: xcm-2s
          xiom:
            - slot: 1
              type: iom-s-3.0t
              mda:
                - slot: 1
                  type: ms18-100gb-qsfp28

    sr2s-nocfg:
      kind: nokia_srsim
      type: sr-2s
      gen-component-config: false
      sfm: sfm-2s
      components:
        - slot: A
          type: cpm-2s
        - slot: 1
          type: xcm-2s
          xiom:
            - slot: 1
              type: iom-s-3.0t
              mda:
                - slot: 1
                  type: ms18-100gb-qsfp28

