# this reusable workflow posts a PR comment with download links for the
# containerlab binaries built in the current workflow run.
# it is used by cicd.yml for same-repo PRs and by build-binaries.yml
# for fork PRs, where the /build-binaries command is used.
# the artifacts are looked up in the caller's workflow run, so the
# build-containerlab.yml job must run in the same workflow run.
name: comment-binaries

"on":
  workflow_call:
    inputs:
      issue_number:
        description: "PR number to comment on"
        required: true
        type: number
      head_sha:
        description: "Commit SHA the binaries were built for"
        required: true
        type: string
      build_result:
        description: "Result of the binary build job(s)"
        required: true
        type: string
      failure_message:
        description: "Comment to post when build_result is not success; not posted when empty"
        required: false
        type: string
        default: ""

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-24.04
    steps:
      - name: Comment PR with binary download URLs
        uses: actions/github-script@v9
        env:
          BUILD_RESULT: ${{ inputs.build_result }}
          FAILURE_MESSAGE: ${{ inputs.failure_message }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);

            if (process.env.BUILD_RESULT !== 'success') {
              if (!process.env.FAILURE_MESSAGE) {
                core.info('Build did not succeed and no failure message was provided, skipping comment.');
                return;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: process.env.FAILURE_MESSAGE,
              });
              return;
            }

            const artifactNames = ['containerlab', 'containerlab-arm64'];
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });

            const artifacts = Object.fromEntries(
              artifactNames.map((name) => {
                const artifact = data.artifacts.find(
                  (candidate) => candidate.name === name && !candidate.expired,
                );
                if (!artifact) {
                  throw new Error(`Artifact not found: ${name}`);
                }

                return [
                  name,
                  {
                    pageUrl: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}/artifacts/${artifact.id}`,
                    apiUrl: `https://api.github.com/repos/${owner}/${repo}/actions/artifacts/${artifact.id}/zip`,
                  },
                ];
              }),
            );

            const marker = '<!-- containerlab-binary-downloads -->';
            const body = [
              marker,
              '<details>',
              `<summary>Download Containerlab binaries for commit ${process.env.HEAD_SHA}:</summary>`,
              '',
              `<a href="${artifacts.containerlab.pageUrl}">containerlab (linux/amd64)</a>`,
              '```bash',
              'curl -sL \\',
              '  -H "Authorization: Bearer $(gh auth token)" \\',
              `  "${artifacts.containerlab.apiUrl}" \\`,
              '  -o containerlab.zip && unzip -p containerlab.zip containerlab > containerlab.tmp && \\',
              '  mv containerlab.tmp containerlab && rm containerlab.zip && chmod +x containerlab',
              '```',
              '',
              `<a href="${artifacts['containerlab-arm64'].pageUrl}">containerlab-arm64 (linux/arm64)</a>`,
              '```bash',
              'curl -sL \\',
              '  -H "Authorization: Bearer $(gh auth token)" \\',
              `  "${artifacts['containerlab-arm64'].apiUrl}" \\`,
              '  -o containerlab-arm.zip && unzip -p containerlab-arm.zip containerlab > containerlab-arm.tmp && \\',
              '  mv containerlab-arm.tmp containerlab && rm containerlab-arm.zip && chmod +x containerlab',
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issue_number,
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) {
              core.info('Skipping binary comment for a closed PR or superseded commit.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
