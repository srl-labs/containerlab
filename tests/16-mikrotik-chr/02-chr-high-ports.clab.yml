name: 16-02-chr-high-ports
topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:7.24.5
  nodes:
    r1:
      kind: mikrotik_chr
      startup-config: |
        /ip address add address=10.0.1.1/30 interface=ether33
    r2:
      kind: mikrotik_chr
      startup-config: |
        /ip address add address=10.0.1.2/30 interface=ether33
  links:
    # A sparse high port: the intervening NICs are created too, so ether33 needs
    # 32 data NICs and lands on the second PCI bridge (AMD64 only).
    - endpoints: ["r1:ether33", "r2:ether33"]
