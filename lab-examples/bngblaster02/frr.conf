frr version 10.7.1
frr defaults traditional
hostname frr
no ipv6 forwarding
!
interface eth1
 ip address 10.0.1.2/24
 ip router isis core
 isis circuit-type level-1
 isis network point-to-point
!
interface eth2
 ip address 10.0.2.2/24
!
interface lo
 ip address 10.10.0.2/32
 ip router isis core
 isis passive
!
router isis core
 net 49.0001.1921.6800.1002.00
 is-type level-1
 metric-style wide
 lsp-gen-interval 1
 spf-interval 1
!
line vty
!
