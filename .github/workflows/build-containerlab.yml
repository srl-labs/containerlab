name: build-clab

"on":
  workflow_call:
    inputs:
      go_ver:
        required: true
        type: string
      runner:
        required: true
        type: string
      arch:
        required: true
        type: string

jobs:
  build-clab:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_ver }}

      # - name: Cache go modules
      #   uses: actions/cache@v6
      #   with:
      #     # In order:
      #     # * Module download cache
      #     # * Build cache (Linux)
      #     path: |
      #       ~/go/pkg/mod
      #       ~/.cache/go-build
      #     key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      #     restore-keys: |
      #       ${{ runner.os }}-go-

      - name: Build containerlab
        run: GOOS=linux GOARCH=${{ inputs.arch }} make build-with-podman-debug BINARY=containerlab
      # store clab binary as artifact
      - name: Upload containerlab binary
        uses: actions/upload-artifact@v7
        with:
          name: containerlab${{ inputs.arch == 'arm64' && '-arm64' || '' }}
          path: containerlab
          compression-level: 0
