name: lint-and-format
on:
  workflow_call:
    inputs:
      go_ver:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      go_ver:
        description: "Go version"
        required: false
        default: ""
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: |
          source .github/vars.env
          echo "go_ver=$GO_VER" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go_ver || steps.vars.outputs.go_ver }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      # runs the same 'make format' as on dev machines. with CI set, the
      # Makefile maps the golangci-lint command to the local binary, which is
      # the one installed by the action above. gofumpt and godot are pinned to
      # the exact container images from .mk/lint.mk, because plain binaries
      # (e.g. upstream gofumpt) behave differently from the forked images the
      # developers actually format with. -it is dropped via the overrides
      # since CI has no TTY.
      - name: Run make format
        if: always()
        run: |
          make format \
            GOFUMPT_CMD="docker run --rm -e GOFUMPT_SPLIT_LONG_LINES=on -v $PWD:/work ghcr.io/hellt/gofumpt:v0.7.0" \
            GODOT_CMD="docker run --rm -v $PWD:/work ghcr.io/hellt/godot:1.4.11"

      - name: Fail if make format changed files
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The following files were changed by 'make format':"
            git status --porcelain
            echo
            git --no-pager diff
            echo
            echo "::error title=Code is not formatted::'make format' modified one or more files, which means your code was not formatted. Please run 'make format' locally, commit the changes and push again."
            exit 1
          fi
