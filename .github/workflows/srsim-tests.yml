name: srsim-tests

"on":
  workflow_call:
    inputs:
      py_ver:
        required: true
        type: string
      uv_ver:
        required: true
        type: string
      runtime:
        type: string
        default: "docker"
      ref:
        type: string
        default: ""
    secrets:
      SRSIM_LICENSE:
        required: false

jobs:
  check-license:
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
        run: |
          if [[ -n "$SRSIM_LICENSE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  srsim-tests:
    runs-on: ubuntu-24.04
    needs: check-license
    if: needs.check-license.outputs.available == 'true'
    env:
      SRSIM_IMAGE_TAG: 26.7.R1
    strategy:
      matrix:
        test-suite:
          - "01*.robot"
          - "03*.robot"
          - "04*.robot"
          - "05*.robot"
          - "06*.robot"
          - "07*.robot"
          - "08*.robot"
          - "09*.robot"
          - "10*.robot"
          - "11*.robot"
          - "12*.robot"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: containerlab-tests

      - name: Move containerlab to usr/bin
        run: sudo mv ./containerlab /usr/bin/containerlab && sudo chown root:root /usr/bin/containerlab && sudo chmod 4755 /usr/bin/containerlab

      - name: Create license file from env vars
        env:
          SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
        run: sudo mkdir -p /opt/nokia/sros/ && echo "$SRSIM_LICENSE" | sudo tee /opt/nokia/sros/license.txt > /dev/null && sudo chmod 600 /opt/nokia/sros/license.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: ${{ inputs.uv_ver }}
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          # cache: pip
          # cache-dependency-path: "tests/requirements.txt"
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Activate virtualenv
        run: |
          . .venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      - name: Sanitize test-suite name
        run: echo "TEST_SUITE=$(echo ${{ matrix.test-suite }} | tr -d '*')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and re-tag srsim image
        run: docker pull ghcr.io/srl-labs/containerlab/nokia_srsim:${SRSIM_IMAGE_TAG} && docker tag ghcr.io/srl-labs/containerlab/nokia_srsim:${SRSIM_IMAGE_TAG} registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}

      - name: Logout from GitHub Container Registry
        run: docker logout ghcr.io

      # - name: setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Run sros-srsim tests
        run: |
          ./tests/rf-run.sh ${{ inputs.runtime }} ./tests/13-srsim/${{ matrix.test-suite }}
      # upload test reports as a zip file
      - name: Upload test logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 13-srsim-log-${{ env.TEST_SUITE }}-${{ inputs.runtime }}
          path: ./tests/out/*.html

      # upload coverage report from unit tests, as they are then
      # merged with e2e tests coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-srsim-tests-${{ env.TEST_SUITE }}-${{ inputs.runtime }}
          path: /tmp/clab-tests/coverage/*
          retention-days: 7
