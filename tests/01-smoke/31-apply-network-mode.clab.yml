name: apply-netmode

topology:
  nodes:
    w1:
      kind: linux
      image: alpine:3
      cmd: tail -f /dev/null
{{- if .driftW1 }}
      env:
        RECONCILE_MARKER: updated
{{- end }}
{{- if .addSidecar1 }}
    w1-sc:
      kind: linux
      image: alpine:3
      cmd: tail -f /dev/null
      network-mode: container:w1
{{- end }}
{{- if and .addTogether (not .removeW2) }}
    w2:
      kind: linux
      image: alpine:3
      cmd: tail -f /dev/null
{{- end }}
{{- if .addTogether }}
    w2-sc:
      kind: linux
      image: alpine:3
      cmd: tail -f /dev/null
      network-mode: container:w2
{{- end }}
