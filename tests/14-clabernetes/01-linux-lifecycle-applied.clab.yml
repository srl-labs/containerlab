# yaml-language-server: $schema=../../schemas/clab.schema.json
# The same lab as 01-linux-lifecycle.clab.yml with one change on server, applied while server is
# stopped.
name: c9s-linux-lifecycle

topology:
  nodes:
    client:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      exec:
        - ip link set dev eth1 up
        - ip addr add dev eth1 10.10.10.1/30
    server:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      env:
        CLAB_APPLY_MARK: applied-while-stopped
      exec:
        - ip link set dev eth1 up
        - ip addr add dev eth1 10.10.10.2/30

  links:
    - endpoints: ["client:eth1", "server:eth1"]
