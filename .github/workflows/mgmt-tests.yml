name: mgmt-tests

"on":
  workflow_call:
    inputs:
      py_ver:
        required: true
        type: string
      uv_ver:
        required: true
        type: string
      runtime:
        type: string
        default: "docker"

jobs:
  mgmt-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET }}
      SRSIM_IMAGE_TAG: 26.7.R1
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - "01*.robot"
          - "02*.robot"
          - "03*.robot"
          - "04*.robot"
          - "05*.robot"
          - "06*.robot"
          - "07*.robot"
          - "08*.robot"
          - "09*.robot"
          - "10*.robot"
          - "11*.robot"
          - "12*.robot"
          - "13*.robot"
          - "14*.robot"

    # allow podman job to fail, since it started to fail on github actions
    continue-on-error: ${{ inputs.runtime == 'podman' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: containerlab-tests

      - name: Move containerlab to usr/bin
        run: sudo mv ./containerlab /usr/bin/containerlab && sudo chown root:root /usr/bin/containerlab && sudo chmod 4755 /usr/bin/containerlab

      - name: Setup Podman
        if: inputs.runtime == 'podman'
        run: sudo bash ./.github/workflows/install-podman.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Install a specific version of uv.
          version: ${{ inputs.uv_ver }}
          enable-cache: true

      - uses: actions/setup-python@v7
        with:
          # cache: pip
          # cache-dependency-path: "tests/requirements.txt"
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Sanitize test-suite name
        run: echo "TEST_SUITE=$(echo ${{ matrix.test-suite }} | tr -d '*')" >> $GITHUB_ENV

      # - name: setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Activate virtualenv
        run: |
          . .venv/bin/activate
          echo PATH=$PATH >> $GITHUB_ENV

      # the SR-SIM suite skips itself when no license is available
      - name: Prepare SR-SIM
        if: startsWith(matrix.test-suite, '12')
        env:
          SRSIM_LICENSE: ${{ secrets.SRSIM_LICENSE }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$SRSIM_LICENSE" ]]; then
            echo "SR-SIM license not available"
            exit 0
          fi
          sudo mkdir -p /opt/nokia/sros/
          echo "$SRSIM_LICENSE" | sudo tee /opt/nokia/sros/license.txt > /dev/null
          sudo chmod 600 /opt/nokia/sros/license.txt
          echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/srl-labs/containerlab/nokia_srsim:${SRSIM_IMAGE_TAG}
          docker tag ghcr.io/srl-labs/containerlab/nokia_srsim:${SRSIM_IMAGE_TAG} registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}
          docker logout ghcr.io

      - name: Run mgmt tests
        run: ./tests/rf-run.sh ${{ inputs.runtime }} ./tests/15-mgmt/${{ matrix.test-suite }}

      # upload test reports as a zip file
      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: 15-mgmt-log-${{ env.TEST_SUITE }}-${{ inputs.runtime }}
          path: ./tests/out/*.html

      # upload coverage report from unit tests, as they are then
      # merged with e2e tests coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-mgmt-tests-${{ env.TEST_SUITE }}-${{ inputs.runtime }}
          path: /tmp/clab-tests/coverage/*
          retention-days: 7
