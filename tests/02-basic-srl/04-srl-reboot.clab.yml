name: 02-04-srl-reboot

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux
  nodes:
    srl1:
      kind: nokia_srlinux
      startup-config: srl1-startup.cli
    srl2:
      kind: nokia_srlinux
      env:
        SRL_LOCATION: test123
      startup-config: srl2-startup.cli

  links:
    - endpoints: ["srl1:e1-1", "srl2:e1-1"]
