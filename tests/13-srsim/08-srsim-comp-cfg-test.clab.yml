    sr14s:
      kind: nokia_srsim
      type: sr-14s
      sfm: sfm2-s
      components:
        - slot: A
          type: cpm2-s
        - slot: 1
          type: xcm2-14s
          mda:
            - slot: 1
              type: x2-s36-800g-qsfpdd-18.0t
