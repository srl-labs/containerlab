frr defaults traditional
hostname {{ .ShortName }}
log stdout
!
interface lo
{{ if eq .ShortName "r1" }}
 ip address 10.31.1.1/32
{{ else }}
 ip address 10.31.2.1/32
{{ end }}
 ip ospf area 0
!
interface eth1
{{ if eq .ShortName "r1" }}
 ip address 10.31.0.1/30
{{ else }}
 ip address 10.31.0.2/30
{{ end }}
 ip ospf area 0
!
router ospf
 passive-interface lo
!
