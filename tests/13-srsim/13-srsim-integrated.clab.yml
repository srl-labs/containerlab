# yaml-language-server: $schema=../../schemas/clab.schema.json
name: srsim-integrated

topology:
  kinds:
    nokia_srsim:
      license: /opt/nokia/sros/license.txt
      image: registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}

  nodes:
    ixr-e2n:
      kind: nokia_srsim
      type: ixr-e2n
      components:
        - type: cpm-ixr-e2n/imm4-sfp+4-sfp+

    ixr-r6:
      kind: nokia_srsim
      type: ixr-r6
      components:
        - slot: A
        - slot: B

    sr-1s:
      kind: nokia_srsim
      type: sr-1s
      components:
        - xiom:
            - slot: 1
              type: iom-s-3.0t
              mda:
                - slot: 1
                  type: ms18-100gb-qsfp28
