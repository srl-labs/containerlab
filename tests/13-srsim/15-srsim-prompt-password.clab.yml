# yaml-language-server: $schema=../../schemas/clab.schema.json
name: srsim-prompt-password

topology:
  kinds:
    nokia_srsim:
      license: /opt/nokia/sros/license.txt
      image: registry.srlinux.dev/pub/nokia_srsim:${SRSIM_IMAGE_TAG}

  nodes:
    srsim:
      kind: nokia_srsim
      type: sr-1
      prompt-password: true
      certificate:
        issue: true
      credentials:
        username: admin
        password: NokiaSros1!
